name: Earthquake Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earthquake-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check earthquake and notify/publish if needed
        env:
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_earthquake.py

      - name: Commit state if changed
        run: |
          git config user.name "earthquake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update earthquake alert state"
            git push
          else
            echo "no state change"
          fi
