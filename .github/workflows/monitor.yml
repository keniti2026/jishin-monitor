name: Earthquake Monitor

on:
  schedule:
    # 5分おき。健一の実体験(北海道胆振東部地震ブラックアウト、携帯基地局は停電後
    # 約30分で電波途絶)を踏まえ、その猶予内に確実に検知・公開できる頻度にしている。
    #
    # 🚨 実験1(2026-08-14): '*/5 * * * *' から '2-59/5 * * * *' へ変更。
    # 実測で間隔の中央値が64分・最大154分になっており(30分要件を満たせていない)、
    # GitHub公式ドキュメントが原因を明示している:
    #   「スケジュールイベントは高負荷時に遅延することがある。高負荷の時間帯には
    #     **毎時0分**が含まれる。負荷が十分高い場合、**キューされたジョブは破棄される**。
    #     遅延の可能性を下げるには、毎時の別の分に実行するようスケジュールすること」
    # つまり観測された「間引き」はジョブの破棄。'*/5' は 0,5,10,…,55分 に発火し
    # **毎時0分と30分という最も混雑する枠を踏んでいた**。
    # '2-59/5' は 2,7,12,…,57分 に発火し、0分・30分の両方を避ける(5分間隔は維持)。
    # 効果は毎月1日の jishin-monitor-monthly-check が実測して docs/latency-experiments.md に記録する。
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: earthquake-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check earthquake and notify/publish if needed
        env:
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_earthquake.py

      # 🚨 if: always() は必須。check_earthquake.py は「記事を投稿できなかった地震が残っている」とき
      # exit 1 で終わる(Actions上で赤く見せて気づけるようにするため)。always() が無いとこの
      # ステップがスキップされ、state.json が保存されずに ntfy 通知が5分おきに重複発火する。
      - name: Commit state if changed
        if: always()
        run: |
          git config user.name "earthquake-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update earthquake alert state"
            git push
          else
            echo "no state change"
          fi
